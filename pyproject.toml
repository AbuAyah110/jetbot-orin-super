[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jetbot-orin-super"
version = "0.5.0"
description = "JetBot Orin Nano Super — hardware guide + agentic AI robotics stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
vision = ["opencv-python-headless>=4.8", "Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "ros2_ws/src/jetbot_base"]
